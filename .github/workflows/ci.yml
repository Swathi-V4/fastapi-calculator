name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fastapi_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastapi_db
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastapi_db
      SECRET_KEY: github-actions-test-secret-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Create database tables
        run: |
          python -c "from app.database import Base, engine; import app.models; Base.metadata.create_all(bind=engine)"

      - name: Run unit and integration tests
        run: |
          pytest tests/unit tests/integration --cov=app -v

      - name: Start FastAPI server
        run: |
          uvicorn main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > server.log 2>&1 &

          echo $! > server.pid

          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8000/; then
              echo "FastAPI server is ready"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "FastAPI server failed to start"
              cat server.log
              exit 1
            fi

            sleep 1
          done

      - name: Run Playwright E2E tests
        run: |
          pytest tests/e2e -v --no-cov

      - name: Show server log on failure
        if: failure()
        run: |
          cat server.log || true

      - name: Stop FastAPI server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: swathi638/fastapi-calculator:latest

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: swathi638/fastapi-calculator:latest
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            swathi638/fastapi-calculator:latest
            swathi638/fastapi-calculator:${{ github.sha }}